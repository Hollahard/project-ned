[pytest]
minversion = 8.0
asyncio_mode = auto
testpaths = services/core/tests tests/e2e tests/soak
norecursedirs = runtime .venv .git apps
markers =
    gpu: marks tests as requiring GPU and TabbyAPI inference (deselect with '-m "not gpu"')
    integration: marks tests as integration tests
    security: marks tests as security and policy validation tests
    soak: marks tests as endurance and continuous soak tests
filterwarnings =
    ignore::starlette.testclient.StarletteDeprecationWarning
    ignore:.*StarletteDeprecationWarning.*

