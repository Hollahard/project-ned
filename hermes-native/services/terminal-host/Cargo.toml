[package]
name = "hermes-terminal-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes",
    "Win32_System_Threading", "Win32_System_IO"
] }

[[bin]]
name = "terminal-fixture"
path = "src/bin/terminal-fixture.rs"

[workspace]
