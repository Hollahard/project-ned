[package]
name = "hermes-preview-watch"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "Owner-scoped local preview invalidations for Hermes Native"

[dependencies]
serde = { version = "1", features = ["derive"] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1"
