[package]
name="owned-ws"
version="0.1.0"
edition="2021"
rust-version="1.85"
publish=false

[lib]
name="hermes_owned_ws"
path="src/lib.rs"

[dependencies]
hermes-resource-host={path="../resource-host"}
hermes-owned-http={path="../owned-http"}
tungstenite={path="vendor/tungstenite",version="=0.30.0",default-features=false,features=["handshake"]}

[dev-dependencies]
log="0.4"

[features]
test-fixture=[]

[[bin]]
name="owned-ws-fixture"
path="tests/fixtures/server.rs"
required-features=["test-fixture"]
