[package]
name = "hermes-session-rpc"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Hermes native session RPC state machine, streaming delta assembly, and transport ambiguity fencing"

[lib]
name = "hermes_session_rpc"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
