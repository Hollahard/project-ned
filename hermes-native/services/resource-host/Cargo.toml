[package]
name = "hermes-resource-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Windows worker ownership feasibility library for Hermes Native"

[lib]
path = "src/lib.rs"

[[bin]]
name = "worker-fixture"
path = "src/bin/worker_fixture.rs"
required-features = ["test-fixture"]

[features]
test-fixture = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1"
