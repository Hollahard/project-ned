[package]
name = "hermes-broker-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Hermes native TabbyAPI inference broker client, model profiler collector, and artifact invalidation"

[lib]
name = "hermes_broker_adapter"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
