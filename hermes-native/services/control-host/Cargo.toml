[package]
name = "hermes-control-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false

[dependencies]
hermes-resource-host = { path = "../resource-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[[bin]]
name = "control-peer-fixture"
path = "tests/fixtures/peer_fixture.rs"
required-features = ["test-fixture"]

[features]
test-fixture = []
