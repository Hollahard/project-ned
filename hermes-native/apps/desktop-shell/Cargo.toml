[package]
name = "hermes-native-shell"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
binding-fixture = ["tauri/dynamic-acl"]

[build-dependencies]
tauri-build = "=2.7.1"

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hermes-preview-watch = { path = "../../services/preview-watch" }
hermes-control-host = { path = "../../services/control-host" }
hermes-catalog-host = { path = "../../services/catalog-host" }
