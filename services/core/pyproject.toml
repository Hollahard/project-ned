[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "friday-core"
version = "0.1.0"
description = "Core agent operating system and inference harness for Project Friday"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Friday Agent Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.1",
    "nvidia-ml-py>=13.0.0",
    "mcp>=1.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "croniter>=2.0.0",
    "tzdata>=2024.1",
    "langfuse>=4.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "gpu: marks tests as requiring GPU and TabbyAPI inference (deselect with '-m \"not gpu\"')",
    "integration: marks tests as integration tests",
    "security: marks tests as security and policy validation tests",
    "soak: marks tests as endurance and continuous soak tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]
